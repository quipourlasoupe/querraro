<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
  <title>querraro</title>
  <LINK href="qpls.css" rel="stylesheet" type="text/css">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
<!--  <link rel="icon" type="image/svg+xml" href="favicon.svg"> -->

  <body style="background-color: Black;">
    <img src="no-robot.png"><br>
    <label style="color: Yellow; font-size: 2.5rem;" for="digit">Ici:</label>
    <input type="number" id="digit" name="digit" min="1" max="9">

    <script>
        const inputField = document.getElementById('digit');

        inputField.addEventListener('input', function() {
            if (this.value.trim() === "5") {
                window.location.href = "https://google.com"; 
            }
        });

    </script>

  </body>
</html>
